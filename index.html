<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DGO Capital</title>
  <meta name="description" content="De la idea al algoritmo para un trading real y consistente">
  <meta property="og:title" content="DGO Capital">
  <meta property="og:description" content="De la idea al algoritmo para un trading real y consistente">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#121828">
  <link rel="icon" type="image/x-icon" href="/icon.ico">
  <link rel="shortcut icon" href="/icon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --card:#0d1426; --card2:#0a101f; --stroke:#1e2a49;
      --text:#e8eefc; --muted:#9fb0d9; --accent:#38bdf8;
      --glow:rgba(56,189,248,.25);
      --green-1:#34d399; --green-2:#10b981; --green-b:#0b8c6d;
      --blue-1:#3b82f6;  --blue-2:#2563eb;  --blue-b:#1d4ed8;
      --white-1:#ffffff; --white-2:#f3f4f6; --white-txt:#0e162c;
      --menuW: clamp(280px, 24vw, 360px);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(1000px 600px at 10% -10%, #162347 0%, transparent 60%),
        linear-gradient(180deg, var(--card) 0%, var(--card2) 100%);
      color:var(--text); line-height:1.6;
    }

    .wrap{width:100%}
    .card{
      min-height:100vh; width:100%; margin:0;
      padding:28px clamp(16px, 4vw, 40px);
      border:1px solid var(--stroke); border-radius:0;
      box-shadow:0 20px 50px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.03);
      display:flex; flex-direction:column; gap:18px;
    }

    /* HEADER */
    header{
      position:relative;
      display:flex; align-items:center; justify-content:space-between;
      gap:16px; flex-wrap:wrap;
      padding:12px 16px;
      background:#000; /* negro */
      border-bottom:1px solid rgba(255,255,255,.06);
    }

    .brand{ display:flex; align-items:center; gap:14px; }

    .brand img{
      height:160px; width:auto; border-radius:14px;
      box-shadow:0 4px 24px rgba(0,0,0,.45);
    }

    .brand-text .muted{
      color:var(--muted);
      font-size:1.2rem;
      margin-top:6px;
      font-weight:600;
    }

    .utc-clock{
      position:absolute; right:0; top:-12px; z-index:1000;
      display:inline-flex; align-items:center; gap:6px;
      padding:5px 12px; border-radius:999px; font-weight:700; font-size:.76rem;
      background:#0b1326; color:#8fb3ff;
      border:1px solid #22407a;
    }

    /* resto igual */
  </style>
</head>

<body>
<div class="wrap">
<div class="card">

<header>
  <div class="brand">
    <img src="logo.png" alt="Logo DGO Capital">
    <div class="brand-text">
      <div class="muted">Certeza en el proceso</div>
    </div>
  </div>

  <div class="utc-clock">
    <span id="loc-time">--:--:--</span>
    <span id="loc-tz">UTC±00</span>
  </div>
</header>

<footer>
  © <span id="yr"></span> DGO Capital. Todos los derechos reservados.
</footer>

</div>
</div>

<script>
document.getElementById('yr').textContent = new Date().getFullYear();
</script>

</body>
</html>
