<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DGO Capital — Desarrollos</title>
  <meta name="description" content="Portafolio de robots/algoritmos desarrollados por DGO Capital.">
  <meta property="og:title" content="DGO Capital — Desarrollos">
  <meta property="og:description" content="Galería de EAs e indicadores desarrollados.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#121828">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --card:#0d1426; --card2:#0a101f; --stroke:#1e2a49;
      --text:#e8eefc; --muted:#9fb0d9; --accent:#38bdf8;
    }
    *{box-sizing:border-box; margin:0; padding:0}
    html,body{height:100%}
    body{
      font-family:Inter, ui-sans-serif, system-ui, sans-serif;
      color:var(--text); line-height:1.6;
      background:
        radial-gradient(1000px 600px at 10% -10%, #162347 0%, transparent 60%),
        linear-gradient(180deg, var(--card) 0%, var(--card2) 100%);
      -webkit-font-smoothing:antialiased;
    }

    .card{
      min-height:100vh; width:100%;
      padding:28px clamp(16px, 4vw, 40px);
      border:1px solid var(--stroke);
      box-shadow:0 20px 50px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.03);
      display:flex; flex-direction:column; gap:20px;
    }

    /* HEADER */
    header{
      display:flex; align-items:center; gap:12px; flex-wrap:wrap;
      padding-bottom:16px; border-bottom:1px solid rgba(255,255,255,.06);
    }
    .btn-back{
      display:inline-flex; align-items:center;
      padding:10px 16px; border-radius:12px; font-weight:700;
      text-decoration:none; color:var(--text);
      background:transparent; border:1px solid #28406e;
      transition:border-color .2s, background .2s;
    }
    .btn-back:hover{ background:rgba(255,255,255,.04); border-color:#3a5a9a; }
    .header-text h1{
      font-size:clamp(1.4rem, 1rem + 2vw, 2.2rem);
      font-weight:700; color:#fff;
    }
    .header-text .sub{ color:var(--muted); font-size:.9rem; margin-top:2px; }

    /* PANEL */
    .panel{
      background:linear-gradient(180deg, #111a31, #0c1427);
      border:1px solid var(--stroke);
      border-radius:16px; padding:24px;
      box-shadow:0 0 0 1px rgba(255,255,255,.02) inset, 0 10px 30px rgba(0,0,0,.25);
    }
    .panel-header{
      display:flex; align-items:center; gap:10px;
      margin-bottom:20px;
    }
    .panel-header h2{
      font-size:1.15rem; font-weight:700; color:#fff;
    }
    .panel-header .line{
      flex:1; height:1px;
      background:linear-gradient(90deg, #1e3060, transparent);
    }
    .panel-header .count{
      font-size:.75rem; font-weight:700; letter-spacing:.08em;
      text-transform:uppercase; color:var(--accent);
      background:rgba(56,189,248,.1); border:1px solid rgba(56,189,248,.2);
      padding:3px 10px; border-radius:99px;
    }

    /* GRID DE CARDS */
    .dev-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
      gap:16px;
    }

    .dev-card{
      background:linear-gradient(160deg, #0f1e38, #0a1428);
      border:1px solid #1a2d50;
      border-radius:14px; overflow:hidden;
      display:flex; flex-direction:column;
      transition:transform .15s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .dev-card:hover{
      transform:translateY(-3px);
      box-shadow:0 14px 36px rgba(0,0,0,.4);
      border-color:#2a4a80;
    }

    /* MINIATURA */
    .thumb{
      width:100%; aspect-ratio:16/9;
      background:#0b1424;
      border-bottom:1px solid #1a2d50;
      display:flex; align-items:center; justify-content:center;
      padding:14px; position:relative; overflow:hidden;
    }
    .thumb::before{
      content:'';
      position:absolute; inset:0;
      background:radial-gradient(ellipse at center, rgba(56,189,248,.04) 0%, transparent 70%);
      pointer-events:none;
    }
    .thumb a{
      display:flex; align-items:center; justify-content:center;
      width:100%; height:100%;
    }
    .thumb img{
      max-width:62%; max-height:62%;
      width:auto; height:auto; object-fit:contain;
      filter:drop-shadow(0 4px 12px rgba(0,0,0,.45));
      transition:transform .25s ease;
    }
    .dev-card:hover .thumb img{ transform:scale(1.05); }

    /* PDF badge */
    .pdf-badge{
      position:absolute; top:10px; right:10px;
      background:rgba(10,20,40,.85); border:1px solid #1e3a6e;
      color:var(--accent); font-size:.65rem; font-weight:700;
      letter-spacing:.08em; text-transform:uppercase;
      padding:3px 8px; border-radius:6px;
      backdrop-filter:blur(4px);
      display:flex; align-items:center; gap:4px;
    }
    .pdf-badge svg{ width:10px; height:10px; }

    /* CUERPO */
    .dev-body{
      padding:14px 16px 16px;
      display:flex; flex-direction:column; gap:6px;
      flex:1;
    }
    .dev-title{
      font-size:1rem; font-weight:700; color:#fff; letter-spacing:.2px;
    }
    .dev-by{
      font-size:.82rem; color:var(--muted);
      display:flex; align-items:center; gap:5px;
    }
    .dev-by::before{
      content:''; display:inline-block;
      width:6px; height:6px; border-radius:50%;
      background:var(--accent); opacity:.6; flex-shrink:0;
    }
    .dev-link{
      margin-top:auto; padding-top:10px;
      display:inline-flex; align-items:center; gap:6px;
      font-size:.82rem; font-weight:600; color:var(--accent);
      text-decoration:none; opacity:.8;
      transition:opacity .2s;
    }
    .dev-link:hover{ opacity:1; }
    .dev-link svg{ width:13px; height:13px; }

    /* FOOTER */
    .footer{
      margin-top:auto; text-align:center; color:var(--muted); font-size:.88rem;
      padding-top:8px; border-top:1px solid rgba(255,255,255,.06);
    }

    a:focus-visible, button:focus-visible{
      outline:2px solid var(--accent); outline-offset:2px; border-radius:10px;
    }
  </style>
</head>
<body>
<div class="card">

  <!-- HEADER -->
  <header>
    <a href="../index.html" class="btn-back">← Volver</a>
    <img src="../logo.png" alt="Logo DGO Capital"
      style="height:59px; border-radius:12px; border:1px solid #1d2947; box-shadow:0 4px 18px rgba(0,0,0,.35)">
    <div class="header-text">
      <h1>Desarrollos</h1>
      <div class="sub">Galería de EAs e indicadores</div>
    </div>
  </header>

  <!-- GRID -->
  <section class="panel">
    <div class="panel-header">
      <h2>Algoritmos</h2>
      <div class="line"></div>
      <span class="count">3 desarrollos</span>
    </div>

    <div class="dev-grid">

      <!-- Bosón Diurno -->
      <article class="dev-card">
        <div class="thumb">
          <a href="./BOSON-DIURNO-US30-PUBLICO.pdf" target="_blank" rel="noopener" title="Ver reporte: Bosón Diurno">
            <img src="./boson-diurno.png" alt="Bosón Diurno" loading="lazy" decoding="async">
          </a>
          <span class="pdf-badge">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z"/></svg>
            PDF
          </span>
        </div>
        <div class="dev-body">
          <p class="dev-title">Bosón Diurno</p>
          <a class="dev-link" href="./BOSON-DIURNO-US30-PUBLICO.pdf" target="_blank" rel="noopener">
            Ver reporte completo
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M7 7h10v10"/></svg>
          </a>
        </div>
      </article>

      <!-- Orion -->
      <article class="dev-card">
        <div class="thumb">
          <a href="./ORION-SP500-PUBLICO.pdf" target="_blank" rel="noopener" title="Ver reporte: Orion">
            <img src="./orion.png" alt="Orion" loading="lazy" decoding="async">
          </a>
          <span class="pdf-badge">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z"/></svg>
            PDF
          </span>
        </div>
        <div class="dev-body">
          <p class="dev-title">Orion</p>
          <a class="dev-link" href="./ORION-SP500-PUBLICO.pdf" target="_blank" rel="noopener">
            Ver reporte completo
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M7 7h10v10"/></svg>
          </a>
        </div>
      </article>

      <!-- Alchemist -->
      <article class="dev-card">
        <div class="thumb">
          <a href="./ALCHEMIST-NAS100-PUBLICO.pdf" target="_blank" rel="noopener" title="Ver reporte: Alchemist">
            <img src="./alchemist.png" alt="Alchemist" loading="lazy" decoding="async">
          </a>
          <span class="pdf-badge">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z"/></svg>
            PDF
          </span>
        </div>
        <div class="dev-body">
          <p class="dev-title">Alchemist</p>
          <a class="dev-link" href="./ALCHEMIST-NAS100-PUBLICO.pdf" target="_blank" rel="noopener">
            Ver reporte completo
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M7 7h10v10"/></svg>
          </a>
        </div>
      </article>

    </div>
  </section>

  <!-- FOOTER -->
  <div class="footer">
    © <span id="yr"></span> DGO Capital. Todos los derechos reservados.
  </div>

</div>
<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
</script>
</body>
</html>
